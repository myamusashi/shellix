[colors]
background={{colors.background.default.hex_stripped}}
foreground={{colors.on_background.default.hex_stripped}}
regular0={{colors.scrim.default.hex_stripped}}
regular1={{colors.error.default.hex_stripped}}
regular2={{colors.secondary_fixed_dim.default.hex_stripped}}
regular3={{colors.tertiary.default.hex_stripped}}
regular4={{colors.primary_fixed.default.hex_stripped}}
regular5={{colors.inverse_surface.default.hex_stripped}}
regular6={{colors.surface_tint.default.hex_stripped}}
regular7={{colors.on_background.default.hex_stripped}}

[cursor]
beam-thickness=1
style=beam

[main]
box-drawings-uses-font-glyphs=true
dpi-aware=true
font=CaskaydiaMono Nerd Font:size=10
font-size-adjustment=0.700000
workers=1

[mouse]
hide-when-typing=true
