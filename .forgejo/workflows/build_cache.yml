name: "Update Inputs, Build and Push to Cachix"

on:
  push:
    branches:
      - "master"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: "Checkout repository"
      uses: actions/checkout@v4
    # - name: "Install sudo (for local 'act' runner)"
    #   run: apt-get update && apt-get install -y sudo
    - uses: cachix/install-nix-action@v31
      with:
        enable_kvm: false
        nix_path: nixpkgs=channel:nixos-unstable
    - name: "Update flake inputs"
      run: nix flake update

    - name: "Check for changes"
      id: git_status
      run: echo "porcelain=$(git status --porcelain=v1 flake.lock)" >> $GITHUB_OUTPUT

    - name: "Commit and push changes"
      if: steps.git_status.outputs.porcelain
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add flake.lock
        git commit -m "chore: update flake.lock"
        git push
    - uses: cachix/cachix-action@v15
      with:
        name: myamusashi
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - name: "Build flake outputs"
      run: |
        nix build .#nixosConfigurations.waltz.config.system.build.toplevel
        nix build .#homeConfigurations.myamusashi.activationPackage
