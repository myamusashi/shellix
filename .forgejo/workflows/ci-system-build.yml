name: "Build system flake outputs"
on:
  workflow_dispatch:

jobs:
  system-build:
    runs-on: ubuntu-latest
    env:
      USER: root
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
      
      # - name: "Install sudo (for local 'act' runner)"
      #   run: apt-get update && apt-get install -y sudo
      
      - name: "Install nix"
        run: |
          curl --connect-timeout 60 --max-time 300 -L https://nixos.org/nix/install | sh -s -- --daemon
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          echo "/nix/var/nix/profiles/default/bin" >> $GITHUB_PATH
          nix --version

      - name: "Setup build environment"
        run: |
          sudo rm -rf /homeless-shelter /tmp/nix-build-home || true
          sudo mkdir -p /tmp/nix-build-home
          sudo chmod 755 /tmp/nix-build-home
          export HOME=/tmp/nix-build-home
      
      - uses: cachix/cachix-action@v15
        with:
          name: myamusashi
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      
      - name: "Build flake outputs"
        env: 
          HOME: /tmp/nix-build-home
        run: |
          nix build .#nixosConfigurations.waltz.config.system.build.toplevel
